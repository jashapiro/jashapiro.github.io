project:
  type: website
  render:
    - "*.qmd"
    - "*.md"
    - "!auto_cv.qmd"
    - "labnotes/**/*.qmd"
    - "courses/biolB215s19/*.qmd"
  resources:
    - "courses/**/*.pdf"
    - "docs/*.pdf"

execute:
  freeze: auto

website:
  title: "ShapBio"
  site-url: https://shapbio.me/
  navbar:
    left:
      - text: home
        href: index.qmd
      - text: about
        menu:
          - text: about Josh
            href: about.qmd
          - text: research
            href: research.qmd
          - text: teaching
            href: teaching.qmd
          - text: cv
            href: cv.qmd
      - text: blog
        href: labnotes.qmd
  page-footer:
    left: |
      Except as noted, all content on [shapbio.me]{xmlns:dct="http://purl.org/dc/terms/" property="dct:title"} by <a xmlns:cc="http://creativecommons.org/ns#" href="http://shapbio.me" property="cc:attributionName" rel="cc:attributionURL">Joshua A Shapiro</a> is licensed under a <a rel="license" href="http://creativecommons.org/licenses/by/3.0/">Creative Commons Attribution 3.0 Unported License</a>.
    background: light

format:
  html:
    theme:
     - default
     - css/shapbio.scss
    toc: true
    toc-location: left
reference-location: margin
fig-format: retina

editor: source

